name: Build and publish bundle

# Rebuilds the production bundle whenever source changes land on main and
# commits the result back, so editing data files is enough to update the site.
# The push is made with the default GITHUB_TOKEN, which by design does NOT
# trigger another workflow run, so no "[skip ci]" guard is needed (and adding
# one would make Cloudflare Pages skip deploying the rebuilt bundle).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Commit and push rebuilt bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Bundle already up to date; nothing to commit."
          else
            git commit -m "Rebuild bundle"
            git push
          fi
